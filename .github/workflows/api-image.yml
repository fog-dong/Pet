name: Build Pet API image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/api-image.yml"

concurrency:
  group: pet-api-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            registry.cn-hangzhou.aliyuncs.com/jiangker/pet-api:latest
            registry.cn-hangzhou.aliyuncs.com/jiangker/pet-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      # Do not interpolate secrets into script body; trailing CR/LF in secrets
      # makes drone-ssh fail with: yaml: control characters are not allowed
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"
            set -a && [ -f .env ] && . ./.env && set +a
            HP="${HOST_PORT:-18766}"
            if [ -f .env ] && grep -qE '^PORT=' .env; then
              echo "WARN: .env has PORT=; use HOST_PORT only"
            fi
            docker compose pull
            docker compose up -d --remove-orphans --wait --wait-timeout 200
            docker compose exec -T api wget -qO- http://127.0.0.1:3000/health
            echo "container /health ok"
            if curl -fsS "http://127.0.0.1:${HP}/health"; then
              echo "host :${HP}/health ok"
            else
              echo "WARN: host 127.0.0.1:${HP}/health failed (ignore if domain ok)"
            fi
            echo "deploy ok"
