services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-postgres
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: pet
      POSTGRES_DB: pet
    ports:
      - "5432:5432"
    volumes:
      - pet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet -d pet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pet_pg_data:
